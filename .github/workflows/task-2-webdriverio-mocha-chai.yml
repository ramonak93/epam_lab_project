name: CI - Task 2 WebDriverIO

on:
  push:
    paths:
      - "task-2-wdio/**"
      - ".github/workflows/task-2-webdriverio-mocha-chai.yml"
  pull_request:
    paths:
      - "task-2-wdio/**"
      - ".github/workflows/task-2-webdriverio-mocha-chai.yml"

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-2-wdio

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: task-2-wdio

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: task-2-wdio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting with Prettier
        run: npm run lint:prettier:fix

  tests:
    needs: quality-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-2-wdio

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: task-2-wdio

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: task-2-wdio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run sign-in tests
        run: npm run test:sign-in

      - name: Run product overview tests
        run: npm run test:product-overview

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webdriverio-screenshots
          path: task-2-wwdio/screenshots/
          if-no-files-found: ignore
