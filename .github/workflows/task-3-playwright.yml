name: CI - Task 3 Playwright

on:
  push:
    paths:
      - "task-3-playwright/**"
      - ".github/workflows/task-3-playwright.yml"
  pull_request:
    paths:
      - "task-3-playwright/**"
      - ".github/workflows/task-3-playwright.yml"

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-3-playwright

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: task-3-playwright

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: task-3-playwright/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting with Prettier
        run: npm run lint:prettier

  tests:
    needs: quality-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./task-3-playwright

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: task-3-playwright

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: task-3-playwright/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test
